# =============================================================
# Neonorte Nginx Config — Produção (VPS Locaweb)
# Domínio Oficial: neonorte-ywara.tech
# =============================================================
#
# ⚠️  ATENÇÃO — LEIA ANTES DE ALTERAR O NGINX EM PRODUÇÃO:
#
# Este arquivo é a BASE da configuração, mas NÃO é o arquivo completo em produção.
# O Certbot (Let's Encrypt) adiciona blocos `listen 443 ssl` e redirects HTTPS
# diretamente no /etc/nginx/sites-available/ywara do VPS.
#
# NUNCA faça:
#   sudo cp vps.conf /etc/nginx/sites-available/ywara  ← ❌ DESTRÓI O SSL
#
# SEMPRE que alterar este arquivo e copiar para o VPS, execute em seguida:
#   sudo certbot --nginx -d kurupira.neonorte-ywara.tech -d admin.neonorte-ywara.tech
#
# Isso regenera os blocos SSL sem perder as configurações de cache/proxy.
# =============================================================

# --- 1. REDIRECIONAMENTO RAIZ (neonorte-ywara.tech -> kurupira) ---
server {
    listen 80;
    server_name neonorte-ywara.tech;
    return 301 https://kurupira.neonorte-ywara.tech$request_uri;
}

# --- 2. KURUPIRA (APP DE ENGENHARIA) ---
server {
    listen 80;
    server_name kurupira.neonorte-ywara.tech;

    # Assets com hash no nome (Vite) → cache longo, nunca mudam
    location ~* \.(js|css|woff2?|png|svg|ico|webp|jpg|jpeg)$ {
        root /srv/ywara/kurupira/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html → NUNCA cachear (garante que deploy novo é visível imediatamente)
    location / {
        root /srv/ywara/kurupira/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    # API Backend Proxy
    location /api {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# --- 3. SUMAÚMA (PAINEL ADMIN) ---
server {
    listen 80;
    server_name admin.neonorte-ywara.tech;

    # Assets com hash no nome (Vite) → cache longo, nunca mudam
    location ~* \.(js|css|woff2?|png|svg|ico|webp|jpg|jpeg)$ {
        root /srv/ywara/sumauma/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html → NUNCA cachear
    location / {
        root /srv/ywara/sumauma/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    # API Backend Proxy (BFF Sumaúma)
    location /admin {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
